spring.application.name=UBStatus

# Banco H2 em arquivo para persistencia entre reinicializacoes
spring.datasource.url=jdbc:h2:file:./data/territory_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Interface de console limpa para o menu interativo
spring.main.banner-mode=off
logging.level.root=WARN
